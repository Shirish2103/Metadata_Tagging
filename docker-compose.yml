version: '3.8'

services:
  api:
    build: .
    container_name: hackathon_api
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - DATASET_ROOT=${DATASET_ROOT:-}